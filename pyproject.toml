[project]
name            = "domain-check"
version         = "0.1.0"
description     = "Add your description here"
readme          = "README.md"
authors         = [{name = "jgeofil", email = "jeremy.geo@gmail.com"}]
requires-python = ">=3.14"
dependencies    = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.5",
    "asyncio>=4.0.0",
    "httpx>=0.27.0",
    "wordfreq>=3.1.1",
]

[project.scripts]
domain-check = "domain_check:main"

[build-system]
requires      = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
